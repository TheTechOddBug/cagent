name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_dispatch:
    inputs:
      image_mode:
        description: Publish on main with auto; test images without publishing on other branches or with build-only
        type: choice
        required: false
        default: auto
        options:
          - auto
          - build-only
      expected_sha:
        description: Optional immutable 40-character commit SHA to verify before authentication
        type: string
        required: false
        default: ''
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

      - name: Lint GitHub Actions
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true
          pyflakes: false

      - name: Lint GitHub Workflows
        run: ./scripts/workflow-lint.sh

      - name: Save Go caches
        if: github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-path }}
          key: ${{ steps.go.outputs.cache-key }}

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1

      - name: Create bin directory
        run: mkdir -p "$HOME/bin"

      - name: Build
        run: task build

      - name: Run tests
        run: |
          task test
          task test-binary

      - name: Save Go caches
        if: github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-path }}
          key: ${{ steps.go.outputs.cache-key }}

  # Compile-only checks that do not depend on the test run. Kept out of
  # build-and-test so they run alongside it instead of extending its wall clock.
  cross-compile-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1

      - name: Cross-compile plan storage
        run: task check-plan-cross

      # The e2e dependency check is already covered by `task test` in build-and-test.
      - name: Test WASM provider registration
        run: task test-wasm-js

      - name: Save Go caches
        if: github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-path }}
          key: ${{ steps.go.outputs.cache-key }}

  # Native Windows tests. Plan storage relies on OS-specific file locking and
  # path semantics, so the full Go test suite runs natively on Windows in a
  # single blocking `task test` step, mirroring the Linux job.
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1

      - name: Go environment
        run: go env GOOS GOARCH CGO_ENABLED CC

      - name: Run tests
        run: task test

      - name: Save Go caches
        if: github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-path }}
          key: ${{ steps.go.outputs.cache-key }}

  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go

      - name: Install go-licences
        run: go install github.com/google/go-licenses@latest

      - name: Check licenses
        run: go-licenses check . --allowed_licenses=Apache-2.0,MIT,BSD-3-Clause,BSD-2-Clause --ignore modernc.org/mathutil --ignore github.com/hashicorp/hcl/v2

      - name: Save Go caches
        if: github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-path }}
          key: ${{ steps.go.outputs.cache-key }}

  build-image:
    if: >-
      github.repository == 'docker/docker-agent' &&
      github.event.repository.fork == false && (
        (github.event_name == 'pull_request' &&
          github.event.pull_request.base.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/heads/') &&
          (github.ref != 'refs/heads/main' || inputs.image_mode == 'build-only') &&
          (inputs.image_mode == '' || inputs.image_mode == 'auto' || inputs.image_mode == 'build-only'))
      )
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    env:
      DOCKER_BUILD_CLOUD_ENDPOINT: docker/docker-agent
      DOCKERHUB_OIDC_CONNECTION_ID: ${{ vars.DOCKERHUB_OIDC_CONNECTION_ID }}
      DOCKER_BUILD_RECORD_UPLOAD: 'true'
      DOCKER_BUILD_SUMMARY: 'true'
    # Build Cloud compiles both platforms natively in parallel; one runner is
    # enough to orchestrate the multi-platform build.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Docker Build Cloud configuration
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_INPUT_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Workflow run commit must be a lowercase 40-character SHA" >&2
            exit 1
          fi
          if [[ -n "${EXPECTED_INPUT_SHA}" ]]; then
            if [[ ! "${EXPECTED_INPUT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "expected_sha must be a lowercase 40-character SHA" >&2
              exit 1
            fi
            if [[ "${EXPECTED_INPUT_SHA}" != "${EXPECTED_SHA}" ]]; then
              echo "expected_sha does not match the workflow run commit" >&2
              exit 1
            fi
          fi
          if ! checked_out_sha="$(git rev-parse HEAD)"; then
            echo "Unable to determine the checked out commit" >&2
            exit 1
          fi
          if [[ "${checked_out_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "Checked out commit does not match the workflow run commit" >&2
            exit 1
          fi
          if [[ -z "${DOCKERHUB_OIDC_CONNECTION_ID}" ]]; then
            echo "DOCKERHUB_OIDC_CONNECTION_ID must be configured" >&2
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub Actions OIDC is unavailable for this workflow run" >&2
            exit 1
          fi

      - name: Get Docker Build Cloud OIDC token
        id: docker_oidc
        uses: docker/oidc-action@b048fb089ace3e15a5fbdd784f4784d284ce5e8d # v1.1.0
        with:
          connection-id: ${{ env.DOCKERHUB_OIDC_CONNECTION_ID }}
          expires-in: 3600

      - name: Docker login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: docker
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Set up Docker Build Cloud
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: cloud
          endpoint: ${{ env.DOCKER_BUILD_CLOUD_ENDPOINT }}
          version: lab:edge
          # Downloading buildx takes seconds; caching it costs ~40 MB per branch.
          cache-binary: false

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          push: false
          load: false
          sbom: false
          provenance: false
          github-token: ''
          build-args: |
            GIT_TAG=pr
            GIT_COMMIT=dev

      - name: Build template
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: template
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          push: false
          load: false
          sbom: false
          provenance: false
          github-token: ''
          build-args: |
            GIT_TAG=pr
            GIT_COMMIT=dev

  # Fork PRs cannot use repository variables or OIDC; build without credentials.
  build-image-fork:
    if: >-
      github.repository == 'docker/docker-agent' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker-container
          cache-binary: false

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          push: false
          load: false
          sbom: false
          provenance: false
          github-token: ''
          build-args: |
            GIT_TAG=pr
            GIT_COMMIT=dev

      - name: Build template
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: template
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          push: false
          load: false
          sbom: false
          provenance: false
          github-token: ''
          build-args: |
            GIT_TAG=pr
            GIT_COMMIT=dev

  build-and-push-image:
    if: >-
      github.repository == 'docker/docker-agent' &&
      github.event.repository.fork == false && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          (inputs.image_mode == '' || inputs.image_mode == 'auto'))
      )
    # Intentionally not gated on lint/tests: images are pushed by digest only
    # (untagged), so building them in parallel with the test jobs shortens the
    # pipeline without publishing anything user-visible. publish-tags below
    # holds the gate and is the only job that moves tags.
    permissions:
      contents: read
      id-token: write
    env:
      DOCKER_BUILD_CLOUD_ENDPOINT: docker/docker-agent
      DOCKERHUB_OIDC_CONNECTION_ID: ${{ vars.DOCKERHUB_OIDC_CONNECTION_ID }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
    # Build Cloud builds both platforms natively in parallel and pushes the
    # untagged multi-arch index by digest; publish-tags adds the tags.
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      template-digest: ${{ steps.build-template.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Docker Build Cloud configuration
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_INPUT_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Workflow run commit must be a lowercase 40-character SHA" >&2
            exit 1
          fi
          if [[ -n "${EXPECTED_INPUT_SHA}" ]]; then
            if [[ ! "${EXPECTED_INPUT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "expected_sha must be a lowercase 40-character SHA" >&2
              exit 1
            fi
            if [[ "${EXPECTED_INPUT_SHA}" != "${EXPECTED_SHA}" ]]; then
              echo "expected_sha does not match the workflow run commit" >&2
              exit 1
            fi
          fi
          if ! checked_out_sha="$(git rev-parse HEAD)"; then
            echo "Unable to determine the checked out commit" >&2
            exit 1
          fi
          if [[ "${checked_out_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "Checked out commit does not match the workflow run commit" >&2
            exit 1
          fi
          if [[ -z "${DOCKERHUB_OIDC_CONNECTION_ID}" ]]; then
            echo "DOCKERHUB_OIDC_CONNECTION_ID must be configured" >&2
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub Actions OIDC is unavailable for this workflow run" >&2
            exit 1
          fi

      - name: Get Docker Hub OIDC token
        id: docker_oidc
        uses: docker/oidc-action@b048fb089ace3e15a5fbdd784f4784d284ce5e8d # v1.1.0
        with:
          connection-id: ${{ env.DOCKERHUB_OIDC_CONNECTION_ID }}
          expires-in: 3600

      - name: Hub login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: docker
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Set up Docker Build Cloud
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: cloud
          endpoint: ${{ env.DOCKER_BUILD_CLOUD_ENDPOINT }}
          version: lab:edge
          # Downloading buildx takes seconds; caching it costs ~40 MB per branch.
          cache-binary: false

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            docker/docker-agent

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          load: false
          github-token: ''
          sbom: true
          provenance: mode=max
          outputs: type=image,name=docker/docker-agent,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_TAG=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}

      # The sandbox template is a stage of the same Dockerfile with identical
      # build args, so it reuses the builder-linux layer from the image build
      # above and embeds the exact same binary.
      - name: Build and push template by digest
        id: build-template
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: template
          platforms: linux/amd64,linux/arm64
          load: false
          github-token: ''
          sbom: true
          provenance: mode=max
          outputs: type=image,name=docker/docker-agent-sbx-templates,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_TAG=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}

  publish-tags:
    if: >-
      github.repository == 'docker/docker-agent' &&
      github.event.repository.fork == false && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          (inputs.image_mode == '' || inputs.image_mode == 'auto'))
      )
    needs: [ lint, build-and-test, cross-compile-checks, windows-tests, license-check, build-and-push-image ]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      IMAGE_DIGEST: ${{ needs.build-and-push-image.outputs.image-digest }}
      TEMPLATE_DIGEST: ${{ needs.build-and-push-image.outputs.template-digest }}
    steps:
      - name: Get Docker Hub OIDC token
        id: docker_oidc
        uses: docker/oidc-action@b048fb089ace3e15a5fbdd784f4784d284ce5e8d # v1.1.0
        with:
          connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTION_ID }}
          expires-in: 3600

      - name: Hub login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: docker
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          cache-binary: false

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            docker/docker-agent
          tags: |
            type=semver,pattern={{version}}
            type=edge
            type=ref,event=pr

      - name: Tag image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          : "${IMAGE_DIGEST:?build-and-push-image produced no digest}"
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "docker/docker-agent@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "docker/docker-agent:${VERSION}"

      # On main only the edge tag moves; on a v* tag both the version tag and
      # the floating latest tag that sandboxes pull by default.
      - name: Tag template
        run: |
          : "${TEMPLATE_DIGEST:?build-and-push-image produced no template digest}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags=(-t "docker/docker-agent-sbx-templates:${version}" -t "docker/docker-agent-sbx-templates:latest")
          else
            version=edge
            tags=(-t "docker/docker-agent-sbx-templates:edge")
          fi
          docker buildx imagetools create "${tags[@]}" "docker/docker-agent-sbx-templates@${TEMPLATE_DIGEST}"
          docker buildx imagetools inspect "docker/docker-agent-sbx-templates:${version}"
