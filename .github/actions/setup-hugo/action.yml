name: Set up Hugo
description: >-
  Installs the Hugo release every docs workflow builds with. Kept in sync with
  the docker/docs HUGO_VERSION pin so docs.docker.com and github.io render the
  same way.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        HUGO_VERSION: 0.163.0
      run: |
        curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin hugo
        hugo version
